<head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
 
    :root {
        --primary: #FF9900;
        --primary-dark: #e68a00;
        --bg-primary: #0f1115;
        --bg-secondary: #1a1d23;
        --bg-tertiary: #242730;
        --text-primary: #e8eaed;
        --text-secondary: #b0b5be;
        --text-muted: #8a8f98;
        --card-bg: #1e2128;
        --card-border: #2d3139;
    }

    body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }

    /* === ANIMATED BACKGROUND === */
    .bg-anim {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(circle at center, #1a1d23 0%, #0f1115 100%);
    }

    .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        animation: float 20s infinite ease-in-out alternate;
    }

    .bg-blob.b1 {
        width: 300px;
        height: 300px;
        background: var(--primary);
        top: -100px;
        left: -100px;
        animation-delay: 0s;
    }

    .bg-blob.b2 {
        width: 250px;
        height: 250px;
        background: #4da6ff;
        bottom: -50px;
        right: -50px;
        animation-delay: -5s;
    }
    
    .bg-blob.b3 {
        width: 200px;
        height: 200px;
        background: #8a2be2;
        top: 40%;
        left: 60%;
        animation-delay: -10s;
        opacity: 0.2;
    }

    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 50px) scale(1.1); }
    }

    /* === CONTAINERS === */
    #langScreen, #updateScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
    }

    #updateScreen {
        opacity: 0;
        pointer-events: none;
        transform: translateY(30px);
        z-index: 10;
    }

    #updateScreen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }

    #langScreen.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-30px);
    }

    /* === LANGUAGE SELECTION === */
    .lang-title {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 8px;
        text-align: center;
        background: linear-gradient(to right, #FF9900, #FF6B6B);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .lang-subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 20px;
        text-align: center;
    }

    /* Dil butonları için daha kompakt bir grid */
    .lang-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 420px;
        padding-bottom: 20px;
    }

    .lang-btn {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 10px;
        color: var(--text-primary);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .lang-btn:active {
        transform: scale(0.96);
        background: var(--bg-tertiary);
    }

    .lang-btn:hover {
        border-color: var(--primary);
        background: rgba(255, 153, 0, 0.1);
    }

    /* === UPDATE SCREEN === */
    .app-icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #FF9900, #FF6B6B);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: #fff;
        margin-bottom: 24px;
        box-shadow: 0 10px 30px rgba(255, 153, 0, 0.4);
        animation: pulseIcon 2s infinite alternate;
    }

    @keyframes pulseIcon {
        0% { transform: scale(1); box-shadow: 0 10px 30px rgba(255, 153, 0, 0.4); }
        100% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(255, 153, 0, 0.6); }
    }

    .update-title {
        font-size: 1.4rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 12px;
        line-height: 1.3;
    }

    .update-text {
        font-size: 0.95rem;
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.6;
        margin-bottom: 30px;
        max-width: 380px;
    }

    .update-text strong {
        color: var(--primary);
    }

    .download-btn {
        background: linear-gradient(to right, #FF9900, #e68a00);
        color: #000;
        border: none;
        border-radius: 16px;
        padding: 18px 32px;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 340px;
        text-decoration: none;
        box-shadow: 0 8px 25px rgba(255, 153, 0, 0.3);
        transition: all 0.3s;
        margin-bottom: 20px;
    }

    .download-btn:active {
        transform: scale(0.97);
    }

    .download-btn i {
        font-size: 1.3rem;
    }

    /* === LANGUAGE TOGGLE IN UPDATE SCREEN === */
    .lang-change-btn {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
    }

    .lang-change-btn:active {
        background: var(--bg-tertiary);
        transform: scale(0.95);
    }

/* =========================================================
   2. UYGULAMA MANTIĞI
   ========================================================= */
const langScreen = document.getElementById('langScreen');
const updateScreen = document.getElementById('updateScreen');
const langGrid = document.getElementById('langGrid');

let currentLang = 'en';

// Dil butonlarını oluştur
function buildLangGrid() {
    langGrid.innerHTML = '';
    LANGS.forEach(lang => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.textContent = lang.label;
        btn.onclick = () => selectLanguage(lang.code);
        langGrid.appendChild(btn);
    });
}

// Dil seçildiğinde çalışır
function selectLanguage(code) {
    currentLang = code;
    applyLanguage();
    
    // Ekranları değiştir (Animasyonlu)
    langScreen.classList.add('hidden');
    setTimeout(() => {
        updateScreen.classList.add('active');
    }, 300);
}

// Metinleri seçilen dile göre güncelle
function applyLanguage() {
    const t = I18N[currentLang] || I18N.en;
    
    // Dil seçim ekranı
    document.getElementById('langTitle').textContent = t.langTitle;
    document.getElementById('langSubtitle').textContent = t.langSubtitle;
    
    // Yönlendirme ekranı
    document.getElementById('upTitle').innerHTML = t.upTitle;
    document.getElementById('upText').innerHTML = t.upText;
    document.getElementById('btnText').textContent = t.btnText;
    document.getElementById('changeLangText').textContent = t.changeLang;
    
    // Arapça için sağdan sola (RTL) desteği
    if (currentLang === 'ar') {
        document.body.setAttribute('dir', 'rtl');
    } else {
        document.body.removeAttribute('dir');
    }
}

// Dil değiştirme butonuna basıldığında dil ekranına geri dön
function showLangScreen() {
    updateScreen.classList.remove('active');
    setTimeout(() => {
        langScreen.classList.remove('hidden');
    }, 300);
}

// Başlangıç
document.addEventListener('DOMContentLoaded', () => {
    buildLangGrid();
    applyLanguage(); // Varsayılan İngilizce metinleri yükle
});
